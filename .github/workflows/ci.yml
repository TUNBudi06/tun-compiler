name: CI

on:
  push:
  pull_request:

jobs:
  # Tests run natively on each Linux arch (both runners can execute the binaries).
  test:
    name: test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-cargo-
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked

  # Termux binaries can't be executed in CI without an Android emulator, so this is a
  # compile-only check: it catches a broken Termux build on every push, not just at release.
  android-check:
    name: android-check (aarch64-linux-android, exectzs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: android-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: android-check-
      - run: cargo install cargo-ndk --locked
      - name: Compile-check exectzs
        # ANDROID_NDK_LATEST_HOME is a runner env var, not a workflow ${{ env }} value; read it in the shell.
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" cargo ndk -t arm64-v8a -p 24 build --locked -p exectzs
