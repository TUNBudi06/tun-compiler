name: CI

on:
  push:
  pull_request:

jobs:
  # Tests run natively on each Linux arch (both runners can execute the binaries).
  test:
    name: test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-cargo-
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked

  # Termux binaries can't be executed in CI without an Android emulator, so this is a
  # compile-only check: it catches a broken Termux build on every push, not just at release.
  android-check:
    name: android-check (aarch64-linux-android, exectzs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: android-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: android-check-
      - name: Compile-check exectzs + quicktzs (NDK clang)
        # Cross-compile straight to aarch64-linux-android with the NDK's clang as linker/CC.
        # (cargo-ndk 4.x panics on these runners; the direct toolchain is simpler and stable.)
        # API 24 clang wrapper; RUSTFLAGS sets 16 KB max page size for Android 15+.
        run: |
          TC="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TC/aarch64-linux-android24-clang"
          export CC_aarch64_linux_android="$TC/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$TC/llvm-ar"
          export RUSTFLAGS="-C link-arg=-Wl,-z,max-page-size=16384"
          cargo build --locked -p exectzs -p quicktzs --target aarch64-linux-android
