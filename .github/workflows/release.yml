name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-release-
      # glibc build (not musl): exectzs dlopen()s native .so libs.
      - run: cargo build --release --locked -p quicktzs-builder -p exectzs -p quicktzs-buildserver
      - name: Package
        id: pkg
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then ver="${GITHUB_REF_NAME}"; else ver="${GITHUB_SHA::7}"; fi
          name="quicktzs-${ver}-${TARGET}"
          mkdir "$name"
          cp target/release/quicktzs target/release/exectzs target/release/quicktzs-buildserver README.md "$name/"
          [ -f LICENSE ] && cp LICENSE "$name/"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: |
            ${{ steps.pkg.outputs.name }}.tar.gz
            ${{ steps.pkg.outputs.name }}.tar.gz.sha256
      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: |
            ${{ steps.pkg.outputs.name }}.tar.gz
            ${{ steps.pkg.outputs.name }}.tar.gz.sha256
    permissions:
      contents: write
